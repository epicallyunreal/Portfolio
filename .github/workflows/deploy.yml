name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Overlapping pushes queue instead of racing; an in-flight deploy is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Generate the CV and Resume PDFs from cv.json and resume.json (printed from /cv)
        run: npm run build:pdf
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}

      - name: Enforce JS bundle budget
        run: npm run check:bundle

      - name: Lighthouse CI (perf ≥ 90, a11y ≥ 95, CLS < 0.1)
        run: npx --yes @lhci/cli@0.14.0 autorun

      # Without this a Lighthouse failure is just a red X — the reports say
      # which assertion broke and by how much.
      - name: Upload Lighthouse reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          # .lighthouseci is a dotfile directory, and upload-artifact excludes
          # hidden paths by default — without this the step "succeeds" having
          # uploaded nothing, which is how a Lighthouse failure became a bare
          # red X with no reports to read.
          include-hidden-files: true
          retention-days: 7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
