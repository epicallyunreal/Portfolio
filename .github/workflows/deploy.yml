name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Overlapping pushes queue instead of racing; an in-flight deploy is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Generate resume PDF from resume.json (printed from /cv, 2-page assert)
        run: npm run build:pdf
        env:
          CV_PHONE: ${{ secrets.CV_PHONE }}

      - name: Enforce JS bundle budget
        run: npm run check:bundle

      - name: Lighthouse CI (perf ≥ 90, a11y ≥ 95, LCP < 2.5s, CLS < 0.1)
        run: npx --yes @lhci/cli@0.14.0 autorun

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
