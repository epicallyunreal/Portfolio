name: PR checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Validate data
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Enforce JS bundle budget
        run: npm run check:bundle

      - name: Lighthouse CI (perf ≥ 90, a11y ≥ 95, LCP < 2.5s, CLS < 0.1)
        run: npx --yes @lhci/cli@0.14.0 autorun

      # Note: true path-based PR previews aren't possible on a user site served
      # from Actions-based Pages (one deployment per repo). The built site is
      # uploaded as an artifact instead, and the PR gets a comment linking to it.
      - name: Upload preview build
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-pr-${{ github.event.number }}
          path: dist
          retention-days: 14

      - name: Comment preview link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview -->'
            const body = [
              marker,
              '### Preview build',
              `The built site for this PR is available as a downloadable artifact:`,
              `[preview-pr-${context.issue.number}](${context.payload.pull_request.html_url.replace(/\/pull\/\d+$/, '')}/actions/runs/${context.runId}#artifacts)`,
              '',
              `Unzip and serve locally: \`npx serve .\``,
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
